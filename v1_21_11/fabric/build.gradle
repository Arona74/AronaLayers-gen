plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = rootProject.mod_version + "+mc${minecraft_version}"
group = rootProject.maven_group

base {
    archivesName = rootProject.archives_base_name + '-fabric'
}

// Sources, most specific first:
// - src/                 Fabric code for this Minecraft version (Platform, FRAPI client models)
// - ../common/src/       this Minecraft version's code and resources for every loader (Compat,
//                        version mixins, mixin config, blocks, data)
// - root src/fabric/     Fabric code for every Minecraft version (entry points, Mod Menu)
// - root src/main/       code and resources for every Minecraft version and loader
sourceSets {
    main {
        java {
            srcDirs += [file('../common/src/main/java'), rootProject.file('src/fabric/java')]
            srcDirs += rootProject.file('src/main/java')
        }
        resources {
            srcDirs += [file('../common/src/main/resources'), rootProject.file('src/fabric/resources'), rootProject.file('src/main/resources')]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // No RTF dependency — no RTF port exists for 1.21.x yet
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
    // Compile-only stand-ins for Mod Menu's API (see ModMenuApi): shipping them would shadow Mod Menu's own.
    exclude 'com/terraformersmc/**'
}

sourcesJar {
    exclude 'com/terraformersmc/**'
}
