plugins {
    // 26.x ships deobfuscated: this is the non-remapping Loom plugin, and there
    // is no mappings dependency because there is nothing to map to.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = rootProject.mod_version + "+mc${minecraft_version}"
group = rootProject.maven_group

base {
    archivesName = rootProject.archives_base_name + '-fabric'
}

// Sources, most specific first:
// - src/                 Fabric code for this Minecraft version (Platform, FRAPI client models)
// - ../common/src/       this Minecraft version's code and resources for every loader (Compat,
//                        version mixins, mixin config, blocks, data)
// - root src/fabric/     Fabric code for every Minecraft version (entry points, Mod Menu)
// - root src/main/       code and resources for every Minecraft version and loader
sourceSets {
    main {
        java {
            srcDirs += [file('../common/src/main/java'), rootProject.file('src/fabric/java')]
            srcDirs += rootProject.file('src/main/java')
        }
        resources {
            srcDirs += [file('../common/src/main/resources'), rootProject.file('src/fabric/resources'), rootProject.file('src/main/resources')]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Nothing is remapped here, so these are plain implementation dependencies.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // 26.2 needs Java 25. Declared as a toolchain rather than relying on JAVA_HOME,
    // because the other modules still target 17 and 21 in the same build.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
    // Compile-only stand-ins for Mod Menu's API (see ModMenuApi): shipping them would shadow Mod Menu's own.
    exclude 'com/terraformersmc/**'
}

sourcesJar {
    exclude 'com/terraformersmc/**'
}
